<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #0a0a0c; color: #efeee9; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 16px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto; border-radius: 50%; border: 7px solid #d7ff3f; }
  h1 { margin: 0; font: 600 28px/1.2 Georgia, "Times New Roman", serif; }
  p { margin: 0; color: #a9a8a3; }
  form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  label { font-size: 14px; }
  input[type=password] { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #3a3a3e;
    background: #151518; color: inherit; font-size: 16px; }
  input:focus-visible, button:focus-visible { outline: 3px solid #d7ff3f; outline-offset: 2px; }
  .recordar { display: flex; gap: 8px; align-items: center; color: #a9a8a3; }
  .recordar input { width: 20px; height: 20px; accent-color: #d7ff3f; }
  button { min-height: 52px; border: 0; border-radius: 999px; background: #d7ff3f; color: #0a0a0c; font: 700 16px system-ui, sans-serif; cursor: pointer; }

</style>

<body>
<main>
  <span class="logo" aria-hidden="true"></span>
  <h1>Tu programa</h1>
  <p>Esta página es solo para alumnas de Lumina IA Studio. Escribí la contraseña que te llegó por mail.</p>
  <form id="f">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required autofocus>
    <label class="recordar"><input id="recordar" type="checkbox" checked> Recordarla en este dispositivo</label>
    <button id="entrar" type="submit">Entrar</button>
    <p id="error" role="alert"></p>
  </form>
</main>
